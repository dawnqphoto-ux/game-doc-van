<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bé nói – tìm vần ao, eo</title>
  <meta name="description" content="Trò chơi học vần ao, eo vui nhộn dành cho học sinh tiểu học.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e0457b'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-size='60'>🎤</text></svg>">
  <meta name="theme-color" content="#9de7f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bé học vần">
</head>
<body>
  <canvas id="fxCanvas" class="fx-canvas"></canvas>
  <header class="header">
    <div class="streak-badge" id="streakBadge">⭐ Bé được: <b id="streakCount">0</b> điểm</div>
  </header>
  <main class="stage">
    <div class="res" id="res"></div>
    <div class="pics" id="pics">
      <div class="hint"> LUYỆN NÓI CÙNG BÉ <b>ao</b> hoặc <b>eo</b></div>
    </div>
  </main>

  <div class="bar">
    <div class="status" id="heard"></div>
    <button class="mic" id="mic">🎤 Bấm và nói</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
